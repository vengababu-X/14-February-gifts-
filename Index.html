<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Story of Us</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Montserrat:wght@200;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg-cream: #fdfaf7;
  --soft-pink: #f8e1e7;
  --deep-rose: #d68c96;
}

body {
  font-family: 'Montserrat', sans-serif;
  background-color: var(--bg-cream);
  color: #4a4242;
  overflow-x: hidden;
  overflow-y: auto;
}

.serif { font-family: 'Cormorant Garamond', serif; }

.hidden-state { display: none !important; }
.fade-in { animation: fadeIn 1s ease forwards; }
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

.box-container {
  position: relative;
  width: 240px;
  height: 220px;
  perspective: 1000px;
  cursor: pointer;
}

.box-body {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 150px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.05);
}

.box-lid {
  position: absolute;
  top: 25px;
  left: -5px;
  width: 250px;
  height: 50px;
  background: white;
  border-radius: 8px;
  transition: all 1s ease;
}

.lid-fly {
  transform: translateY(-150px) rotate(-20deg);
  opacity: 0;
}

#hearts-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen p-6">

<!-- INTRO -->
<div id="screen-intro" class="text-center max-w-sm">
  <h1 class="serif italic text-4xl mb-8">A gentle surprise, just for you.</h1>
  <button id="btn-start" class="px-8 py-3 border border-rose-300 text-rose-400 rounded-full">
    Enter
  </button>
</div>

<!-- GAME -->
<div id="screen-game" class="hidden-state text-center fade-in">
  <h2 class="serif text-2xl italic mb-10">Collect 3 Sparkles</h2>
  <div id="game-zone" class="relative w-80 h-80 mx-auto">
    <button id="gift-sparkle" class="absolute text-4xl">🤍</button>
  </div>
  <p id="game-status" class="mt-6 text-sm">0 / 3</p>
</div>

<!-- GIFTS -->
<div id="screen-gifts" class="hidden-state flex flex-col items-center fade-in">
  <div id="gift-interaction">
    <div class="box-container" onclick="openBox()">
      <div class="box-lid" id="lid"></div>
      <div class="box-body"></div>
    </div>
    <p class="mt-6 italic">Tap the box</p>
  </div>

  <div id="gift-reveal" class="hidden-state text-center">
    <img id="gift-photo" class="w-72 h-80 object-cover rounded-xl shadow-xl mb-6">
    <h3 id="gift-title" class="serif text-2xl mb-2"></h3>
    <p id="gift-desc" class="text-gray-500 mb-6"></p>
    <button onclick="nextGift()" class="text-rose-400 underline">Next</button>
  </div>
</div>

<!-- FINAL -->
<div id="screen-final" class="hidden-state text-center fade-in">
  <h1 class="serif italic text-4xl mb-10">Will you be my Valentine?</h1>
  <button onclick="celebrate()" class="px-8 py-4 border border-rose-300 rounded-full text-rose-400">
    YES
  </button>
</div>

<canvas id="hearts-canvas"></canvas>

<audio id="guitar-player" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9a6a60.mp3?filename=romantic-guitar-110731.mp3" type="audio/mpeg">
</audio>

<script>
const state = {
  sparkles: 0,
  step: 0,
  content: [
    {
      title: "Roses",
      desc: "Soft and beautiful.",
      image: "https://images.unsplash.com/photo-1561181286-d3fee7d55364?auto=format&fit=crop&w=600&q=80"
    },
    {
      title: "Chocolates",
      desc: "A little sweetness.",
      image: "https://images.unsplash.com/photo-1549007994-cb92caebd54b?auto=format&fit=crop&w=600&q=80"
    },
    {
      title: "Golden Sparkle",
      desc: "Because you shine.",
      image: "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=600&q=80"
    }
  ]
};

const intro = document.getElementById("screen-intro");
const game = document.getElementById("screen-game");
const gifts = document.getElementById("screen-gifts");
const finalScreen = document.getElementById("screen-final");

document.getElementById("btn-start").onclick = () => {
  intro.classList.add("hidden-state");
  game.classList.remove("hidden-state");
  moveSparkle();

  const audio = document.getElementById("guitar-player");
  audio.volume = 0.6;
  audio.play().catch(err => console.error(err));
};

function moveSparkle() {
  const sparkle = document.getElementById("gift-sparkle");
  sparkle.style.left = Math.random()*70 + "%";
  sparkle.style.top = Math.random()*70 + "%";
}

document.getElementById("gift-sparkle").onclick = () => {
  state.sparkles++;
  document.getElementById("game-status").innerText = state.sparkles + " / 3";
  if(state.sparkles < 3) moveSparkle();
  else {
    game.classList.add("hidden-state");
    gifts.classList.remove("hidden-state");
  }
};

function openBox() {
  document.getElementById("lid").classList.add("lid-fly");

  setTimeout(() => {
    document.getElementById("gift-interaction").classList.add("hidden-state");
    document.getElementById("gift-reveal").classList.remove("hidden-state");

    const gift = state.content[state.step];
    document.getElementById("gift-photo").src = gift.image;
    document.getElementById("gift-title").innerText = gift.title;
    document.getElementById("gift-desc").innerText = gift.desc;
  }, 600);
}

function nextGift() {
  state.step++;
  document.getElementById("lid").classList.remove("lid-fly");

  if(state.step < state.content.length){
    document.getElementById("gift-reveal").classList.add("hidden-state");
    document.getElementById("gift-interaction").classList.remove("hidden-state");
  } else {
    gifts.classList.add("hidden-state");
    finalScreen.classList.remove("hidden-state");
  }
}

function celebrate() {
  startHearts();
}

function startHearts() {
  const canvas = document.getElementById("hearts-canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const hearts = Array.from({length:40}, () => ({
    x: Math.random()*canvas.width,
    y: canvas.height,
    s: Math.random()*5+2,
    v: Math.random()*1.5+0.5
  }));

  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#ffccd5";
    hearts.forEach(h=>{
      ctx.beginPath();
      ctx.arc(h.x,h.y,h.s,0,Math.PI*2);
      ctx.fill();
      h.y-=h.v;
      if(h.y<0) h.y=canvas.height;
    });
    requestAnimationFrame(loop);
  }
  loop();
}
</script>
</body>
</html>
